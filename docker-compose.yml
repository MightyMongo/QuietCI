services:
  quietci:
    build: .
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      QUIETCI_DATABASE_PATH: /app/.data/quietci.sqlite
      QUIETCI_RULES_PATH: /app/config/rules.yaml
      QUIETCI_TARGETS_PATH: /app/config/targets.yaml
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./.data:/app/.data
